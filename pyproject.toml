[project]
name = "oralia"
version = "0.1.0"
description = "ORAL-IA — nucleo cognitivo y ejecucion local (Feature 001)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "structlog>=24.4",
  "psutil>=6.0",
  "chromadb>=0.5",
  "sentence-transformers>=3.2",
  "pdfplumber>=0.11",
  "pypdfium2>=4.18",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "black>=24.10",
]
speech = [
  "faster-whisper>=1.2.1,<2",
  "piper-tts>=1.8,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oralia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "contract: contract tests validating a single interface (agent contract or HTTP endpoint)",
  "integration: integration tests spanning multiple components/agencies",
  "failure: tests exercising failure, timeout, cancellation, conflict and blocking paths",
  "e2e: browser-driven end-to-end tests (require apps/web running; skipped without Node)",
  "ollama: real-Ollama integration tests (Feature 003) — skipped by default, require ORALIA_OLLAMA_BASE_URL",
  "speech: real local STT/TTS tests (Feature 004) — skipped by default, require configured models",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...)-in-default-argument is the framework's idiomatic pattern.
ignore = ["B008"]

[tool.black]
line-length = 110
target-version = ["py312"]
extend-exclude = "apps/web"
